<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
<style>text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="360" fill="#FFFFFF"/>
<text x="40" y="36" font-size="16" font-weight="600" fill="#0C447C">LRP-sec-2 密钥层次与世代换代</text>

<rect x="170" y="64" width="340" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<text x="340" y="84" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">根密钥：PSK 32B（带外配置）</text>
<text x="340" y="103" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">menuconfig / --psk，两端一致</text>
<line x1="340" y1="116" x2="340" y2="142" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="150" y="144" width="380" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">会话密钥 = CMAC-KDF(PSK, 两端随机会话因子)</text>
<text x="340" y="183" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">CM 握手交换 rnd → 会话级隔离，换会话即换钥</text>
<line x1="340" y1="196" x2="340" y2="222" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="130" y="224" width="420" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="340" y="244" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">帧子密钥 = KDF(会话密钥, conn_id = 世代)</text>
<text x="340" y="263" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">每发送 2^20 帧换代；收发双方按帧头各自派生，零协调</text>

<rect x="130" y="292" width="420" height="34" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="309" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">nonce = op｜世代｜seq → 2^40 帧内不重复（seq 环绕亦安全）</text>
<text x="340" y="348" text-anchor="middle" font-size="11" fill="#5F5E5A">AES-256-GCM 加密+认证｜PSK 泄露不致解密其他会话（前向保密 DH 列入 v2.1）</text>
</svg>
