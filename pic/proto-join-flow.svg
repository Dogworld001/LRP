<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430">
<style>text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="430" fill="#FFFFFF"/>
<text x="40" y="38" font-size="16" font-weight="600" fill="#0C447C">零配置入网时序（迟到节点随时加入）</text>

<rect x="60" y="70" width="120" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="120" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">新节点 X</text>
