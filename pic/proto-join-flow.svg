<text x="340" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">已有节点 A</text>
<rect x="500" y="70" width="120" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="560" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">已有节点 B</text>

<line x1="120" y1="110" x2="120" y2="380" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="340" y1="110" x2="340" y2="380" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="560" y1="110" x2="560" y2="380" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>

<line x1="120" y1="150" x2="332" y2="150" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="120" y1="150" x2="552" y2="150" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="340" y="138" text-anchor="middle" font-size="11" fill="#085041">SRDISCOVER（组播/广播，每 2s，携 rnd）</text>

<line x1="340" y1="196" x2="128" y2="196" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="234" y="184" text-anchor="middle" font-size="11" fill="#0C447C">SROFFER（…rnd / epoch / boundary）</text>

<line x1="560" y1="242" x2="128" y2="242" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="344" y="230" text-anchor="middle" font-size="11" fill="#0C447C">SROFFER（…rnd / epoch / boundary）</text>

<line x1="120" y1="288" x2="332" y2="288" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="226" y="276" text-anchor="middle" font-size="11" fill="#085041">SRJOIN（…rnd / epoch / boundary）</text>

<line x1="120" y1="330" x2="552" y2="330" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="336" y="318" text-anchor="middle" font-size="11" fill="#085041">SRJOIN（…rnd / epoch / boundary）</text>

<line x1="120" y1="366" x2="332" y2="366" stroke="#185FA5" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<line x1="120" y1="366" x2="552" y2="366" stroke="#185FA5" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="340" y="354" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C">双向 QP 建立，进入对等互访</text>

<text x="340" y="412" text-anchor="middle" font-size="11" fill="#5F5E5A">设备任意时刻上电即融入网络 —— 无需预配置、无需预分配标识符（身份 = 硬件 MAC 派生）</text>
